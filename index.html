<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="لعبة إكس أو للاعبين">
  <title>لعبة إكس أو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <button class="settings-trigger" id="open-settings" type="button" aria-label="Open settings" aria-haspopup="dialog" aria-controls="settings-modal">
    <i class="fa-solid fa-bars" aria-hidden="true"></i>
  </button>
  <main class="game-page">
    <section class="game-card" aria-labelledby="game-title">
      <header class="game-header">
        <div class="eyebrow"><span class="status-dot" aria-hidden="true"></span> لعبة للاعبين</div>
        <h1 id="game-title">X<span class="title-dash"> ~</span> O <span class="title-game">Game</span></h1>
        <p class="turn-message" id="turn-message" aria-live="polite"><span id="turn" class="turn-mark">غزل (X)</span> دورك</p>
      </header>

      <div class="game-board" role="group" aria-label="Tic-tac-toe game board">
        <button class="cell" type="button" data-cell aria-label="Top left cell"></button>
        <button class="cell" type="button" data-cell aria-label="Top center cell"></button>
        <button class="cell" type="button" data-cell aria-label="Top right cell"></button>
        <button class="cell" type="button" data-cell aria-label="Middle left cell"></button>
        <button class="cell" type="button" data-cell aria-label="Center cell"></button>
        <button class="cell" type="button" data-cell aria-label="Middle right cell"></button>
        <button class="cell" type="button" data-cell aria-label="Bottom left cell"></button>
        <button class="cell" type="button" data-cell aria-label="Bottom center cell"></button>
        <button class="cell" type="button" data-cell aria-label="Bottom right cell"></button>
      </div>

      <section class="scoreboard" aria-label="Game score">
        <div class="score-item score-x"><span id="score-x-name">غزل</span><strong id="score-x">0</strong></div>
        <span class="score-separator" aria-hidden="true">:</span>
        <div class="score-item score-o"><span id="score-o-name">ريما</span><strong id="score-o">0</strong></div>
      </section>

      <button class="restart-button" id="restart-game" type="button" hidden>العبوا مرة أخرى</button>

      <footer class="game-footer">
        <span class="player-chip player-x"><span class="chip-symbol">X</span> غزل</span>
        <span class="footer-divider" aria-hidden="true"></span>
        <span class="player-chip player-o"><span class="chip-symbol">O</span> ريما</span>
      </footer>
    </section>
    <p class="page-note">خذي دورك، واختاري حركتك</p>
  </main>

  <div class="modal-backdrop" id="settings-modal" hidden>
    <section class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <button class="modal-close" id="close-settings" type="button" aria-label="Close settings">&times;</button>
      <p class="modal-eyebrow">خصصوا اللعبة كما تحبون</p>
      <h2 id="settings-title">إعدادات اللعبة</h2>

      <fieldset class="theme-fieldset">
        <legend>اختاري الثيم</legend>
        <label class="theme-option"><input type="radio" name="theme" value="neon" checked><span class="theme-preview theme-neon"></span><span>نيون</span></label>
        <label class="theme-option"><input type="radio" name="theme" value="gradient"><span class="theme-preview theme-gradient"></span><span>متدرج</span></label>
        <label class="theme-option"><input type="radio" name="theme" value="royal"><span class="theme-preview theme-royal"></span><span>ملكي</span></label>
      </fieldset>

      <div class="name-fields">
        <label for="player-x-name">اسم لاعبة X</label>
        <input id="player-x-name" type="text" maxlength="18" placeholder="غزل">
        <label for="player-o-name">اسم لاعبة O</label>
        <input id="player-o-name" type="text" maxlength="18" placeholder="ريما">
      </div>
      <div class="color-fields">
        <label for="color-x">لون X <input id="color-x" type="color" value="#00f3ff"></label>
        <label for="color-o">لون O <input id="color-o" type="color" value="#ff007f"></label>
      </div>
      <div class="ai-fields">
        <label class="ai-option" for="ai-x"><input id="ai-x" type="checkbox"> <span id="ai-x-label">غزل تلعب كذكاء اصطناعي (X)</span></label>
        <label class="ai-option" for="ai-o"><input id="ai-o" type="checkbox"> <span id="ai-o-label">ريما تلعب كذكاء اصطناعي (O)</span></label>
        <p class="ai-note">إذا فعّلتِ الخيارين، ستلعب اللعبة تلقائيًا بين الذكاءين مع مهلة قصيرة بين الحركات.</p>
      </div>
      <button class="save-settings" id="save-settings" type="button">حفظ الإعدادات</button>
    </section>
  </div>
</body>
</html>
